<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katalogi sprzedażowe - SobolTech24</title><style>body{margin:0;background:#081018;color:#eaf1f7;font-family:Inter,Arial,sans-serif}.top{position:sticky;top:0;background:#0b141d;border-bottom:1px solid #243545;padding:14px 20px;z-index:3}.top a{color:#65e6e0;text-decoration:none;font-weight:800}.wrap{max-width:1120px;margin:0 auto;padding:34px 16px 70px}.hero{margin-bottom:26px}.hero h1{font-size:38px;margin:0 0 8px}.hero p{color:#9eb0c1}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tab{border:1px solid #2c4357;background:#101c28;color:#dce7ef;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.tab.active{background:#5ee8de;color:#061014}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 22px}.pill{background:#101c28;border:1px solid #253a4c;border-radius:10px;padding:10px 14px;color:#b9c8d4}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#0f1924;border:1px solid #233647;border-radius:14px;padding:18px}.head{display:flex;gap:14px;justify-content:space-between;align-items:flex-start}.card h2{font-size:18px;margin:0;line-height:1.3}.price{font-size:18px;font-weight:900;color:#6ff2e4;white-space:nowrap}.card ul{color:#b8c7d2;padding-left:19px;line-height:1.45}.card a{display:inline-block;margin-top:8px;background:#5ee8de;color:#071117;text-decoration:none;font-weight:900;padding:10px 13px;border-radius:9px}.empty{color:#9eb0c1}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}.head{display:block}.price{margin-top:8px}}</style></head><body><div class="top"><a href="index.html">← SobolTech24</a></div><main class="wrap"><section class="hero"><h1>Katalogi sprzedażowe</h1><p>Aktualne katalogi ofert OLX i Allegro Lokalnie. Stan danych: 23.08.2026.</p></section><div class="tabs"><button class="tab" data-cat="olx">OLX</button><button class="tab" data-cat="allegro">Allegro Lokalnie</button></div><div id="summary" class="summary"></div><div id="grid" class="grid"></div></main><script src="katalogi-data.js"></script><script>const grid=document.getElementById('grid'),summary=document.getElementById('summary'),tabs=[...document.querySelectorAll('.tab')];function esc(s=''){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function render(k){tabs.forEach(x=>x.classList.toggle('active',x.dataset.cat===k));const d=CATALOGS[k];summary.innerHTML=`<span class="pill"><b>${d.length}</b> aktywnych ofert</span><span class="pill">Platforma: <b>${k==='olx'?'OLX':'Allegro Lokalnie'}</b></span>`;grid.innerHTML=d.map(x=>`<article class="card"><div class="head"><h2>${esc(x.title)}</h2><div class="price">${esc(x.price)}</div></div><ul>${x.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener">Otwórz ofertę</a>`:''}</article>`).join('')||'<p class="empty">Brak ofert.</p>'}tabs.forEach(b=>b.onclick=()=>{history.replaceState(null,'','?platform='+b.dataset.cat);render(b.dataset.cat)});const start=new URLSearchParams(location.search).get('platform')==='allegro'?'allegro':'olx';render(start);</script></body></html>
